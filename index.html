<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vương quốc ba loại từ</title><style>*{box-sizing:border-box}body{font:20px system-ui,sans-serif;background:linear-gradient(135deg,#172554,#4c1d95);color:#172554;margin:0;min-height:100vh;padding:20px}main{max-width:850px;margin:auto;background:#fff;border-radius:24px;padding:clamp(16px,4vw,40px);box-shadow:0 12px 40px #0005}h1{font-size:clamp(25px,5vw,40px);color:#5931a9}button,input{font:inherit;padding:14px;border-radius:12px;border:2px solid #c4b5fd}button{cursor:pointer;background:#ede9fe;color:#312e81;font-weight:bold;margin:5px}button:hover,button:focus{background:#ddd6fe}button:disabled{opacity:.55}#word{font-size:34px;color:#7c3aed;font-weight:bold}#bar{height:12px;background:#e9e5ff;border-radius:10px;overflow:hidden}#fill{height:100%;background:#16a34a}#feedback{min-height:60px;font-weight:bold}[hidden]{display:none!important}small{color:#555}mark{overflow-wrap:anywhere}#sentence{line-height:1.8}button:focus-visible{outline:3px solid #2563eb}input{max-width:100%}.choices{display:flex;flex-wrap:wrap;gap:8px}.choices button{flex:1;min-width:130px}mark{background:#fef08a;padding:2px 5px;border-radius:5px}</style><main><h1>💎 VƯƠNG QUỐC BA LOẠI TỪ</h1><div id="start"><p>Thu thập 5 viên ngọc qua 50 thử thách!<br>Đúng lần đầu: 2 điểm; đúng lần hai: 1 điểm; sai cả hai lần: 0 điểm.</p><input id="name" placeholder="Tên hoặc biệt danh" aria-label="Tên hoặc biệt danh" maxlength="80"><p><button onclick="beginGame()">Bắt đầu hành trình</button></p></div><div id="play" hidden><div id="stats"></div><div id="bar"><div id="fill"></div></div><h2 id="stage"></h2><p id="sentence"></p><p>Từ được tô vàng thuộc từ loại nào?</p><div class="choices" id="choices"></div><p id="feedback" aria-live="polite"></p><button id="next" hidden onclick="advance()">Tiếp tục →</button></div><div id="end" hidden></div></main><script>const Q=[["Chiếc bàn bằng gỗ.", "bàn", "Danh từ"], ["Nam chạy trên sân.", "chạy", "Động từ"], ["Bông hoa rất đỏ.", "đỏ", "Tính từ"], ["Em có một chiếc bút.", "bút", "Danh từ"], ["Lan đọc truyện.", "đọc", "Động từ"], ["Cây cau rất cao.", "cao", "Tính từ"], ["Con mèo nằm ngủ.", "mèo", "Danh từ"], ["Em viết bài.", "viết", "Động từ"], ["Quả bóng rất tròn.", "tròn", "Tính từ"], ["Em xếp sách lên kệ.", "sách", "Danh từ"], ["Trong vườn có nhiều cây.", "cây", "Danh từ"], ["Bé uống nước.", "uống", "Động từ"], ["Chiếc áo rất đẹp.", "đẹp", "Tính từ"], ["Mẹ mua cam.", "cam", "Danh từ"], ["Bố sửa xe.", "sửa", "Động từ"], ["Con đường rất rộng.", "rộng", "Tính từ"], ["Lan gấp giấy.", "gấp", "Động từ"], ["Bầu trời xanh.", "xanh", "Tính từ"], ["Chú chó nằm dưới bàn.", "chó", "Danh từ"], ["Em rất yêu mẹ.", "yêu", "Động từ"], ["Chiếc cặp này còn rất mới.", "mới", "Tính từ"], ["Bà kể chuyện cho em nghe.", "kể", "Động từ"], ["Hà Nội có nhiều công viên.", "Hà Nội", "Danh từ"], ["Em nhớ bà.", "nhớ", "Động từ"], ["Nước trong cốc rất lạnh.", "lạnh", "Tính từ"], ["Các bác nông dân gặt lúa.", "nông dân", "Danh từ"], ["Bạn Mai rất chăm chỉ.", "chăm chỉ", "Tính từ"], ["Chim sẻ bay qua vườn.", "bay", "Động từ"], ["Niềm vui của em là được gặp bạn bè.", "Niềm vui", "Danh từ"], ["Cây phượng có thân to.", "to", "Tính từ"], ["Sáng nay, lớp em trồng hoa. Các bạn đào đất rồi tưới nước.", "đào", "Động từ"], ["Bà có một khu vườn. Những quả bưởi rất nặng.", "nặng", "Tính từ"], ["Trời mưa. Mẹ lấy áo mưa cho em.", "áo mưa", "Danh từ"], ["Minh làm bài tập. Em kiểm tra từng phép tính.", "kiểm tra", "Động từ"], ["Chú mèo nằm bên cửa sổ. Bộ lông của nó rất mềm.", "mềm", "Tính từ"], ["Cô giáo kể chuyện. Học sinh chăm chú lắng nghe.", "Học sinh", "Danh từ"], ["Em giúp bà nhặt rau. Bà mỉm cười.", "nhặt", "Động từ"], ["Trên bàn có một lọ hoa. Những cánh hoa rất mỏng.", "mỏng", "Tính từ"], ["Nam đến thư viện. Bạn chọn một cuốn truyện.", "thư viện", "Danh từ"], ["Đội bóng tập luyện mỗi chiều. Các cầu thủ rất khỏe.", "khỏe", "Tính từ"], ["Mẹ đang cân gạo.", "cân", "Động từ"], ["Mẹ đặt chiếc cân lên bàn.", "cân", "Danh từ"], ["Bé đá quả bóng.", "đá", "Động từ"], ["Ven đường có một hòn đá.", "đá", "Danh từ"], ["Em đang mơ về chuyến du lịch cùng gia đình.", "mơ", "Động từ"], ["Đêm qua, em có một giấc mơ đẹp.", "giấc mơ", "Danh từ"], ["Bác thợ sơn cửa.", "sơn", "Động từ"], ["Bác mua một hộp sơn.", "sơn", "Danh từ"], ["Chiếc khăn rất khô.", "khô", "Tính từ"], ["Bạn Lan rất dũng cảm.", "dũng cảm", "Tính từ"]];const stages=['Khu rừng nhận diện','Thung lũng phân loại','Ngôi làng ngữ cảnh','Lâu đài thử thách','Kho báu tiếng Việt'];let i=0,score=0,tries=0,locked=false,student='',scores=[0,0,0,0,0];const el=x=>document.getElementById(x);function beginGame(){student=el('name').value.trim();if(!student){el('name').focus();return}el('start').hidden=true;el('play').hidden=false;render()}function render(){tries=0;locked=false;el('stats').textContent=`Câu ${i+1}/50 • Điểm ${score}/100 • Ngọc ${'💎'.repeat(Math.floor(i/10))}`;el('fill').style.width=(i/50*100)+'%';el('stage').textContent='Chặng '+(Math.floor(i/10)+1)+': '+stages[Math.floor(i/10)];let [sentence,word]=Q[i];let pos=sentence.indexOf(word);let mark=document.createElement('mark');mark.textContent=word;el('sentence').replaceChildren(document.createTextNode(sentence.slice(0,pos)),mark,document.createTextNode(sentence.slice(pos+word.length)));el('feedback').textContent='';el('next').hidden=true;el('choices').replaceChildren();['Danh từ','Động từ','Tính từ'].forEach(a=>{let b=document.createElement('button');b.textContent=a;b.onclick=()=>answer(a,b);el('choices').append(b)})}function answer(a,b){if(locked)return;tries++;let correct=Q[i][2];if(a!==correct&&tries===1){b.disabled=true;el('feedback').textContent='Chưa đúng. Em hãy đọc lại câu và thử một lần nữa!';return}locked=true;let p=a===correct?3-tries:0;score+=p;scores[Math.floor(i/10)]+=p;let reason=correct==='Danh từ'?'chỉ sự vật (người, vật, hiện tượng hoặc khái niệm)':correct==='Động từ'?'chỉ hoạt động hoặc trạng thái':'chỉ đặc điểm, tính chất';el('feedback').textContent=(p?'Chính xác! +'+p+' điểm. ':'Đáp án: '+correct+'. ')+Q[i][1]+' là '+correct.toLowerCase()+' trong câu này, '+reason+'.';el('choices').querySelectorAll('button').forEach(x=>x.disabled=true);el('next').hidden=false}function advance(){if(!locked)return;i++;if(i<50){render();return}el('play').hidden=true;el('end').hidden=false;let h=document.createElement('h2');h.textContent='🏆 💎💎💎💎💎 '+student+' — '+score+'/100 điểm';el('end').append(h);scores.forEach((s,j)=>{let p=document.createElement('p');p.textContent=stages[j]+': '+s+'/20';el('end').append(p)});let b=document.createElement('button');b.textContent='Chơi lại';b.onclick=()=>location.reload();el('end').append(b)}</script></html>
